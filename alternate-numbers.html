<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Alternate Numbers</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="loan-page">

    <div class="top-box">

        <h1>
            Alternate Numbers
        </h1>

        <p>
            Add alternate contact details
        </p>

    </div>

    <div class="card">

        <div class="details-box">

            <div class="detail-row"
            style="border:none;display:block;">

                <label>
                    Alternate Number
                </label>

                <input
                type="number"
                id="alternate"
                placeholder="Enter Alternate Number">

            </div>

            <div class="detail-row"
            style="border:none;display:block;">

                <label>
                    Emergency Contact
                </label>

                <input
                type="number"
                id="emergency"
                placeholder="Enter Emergency Contact">

            </div>

        </div>

        <button
        class="apply-btn"
        onclick="nextPage()">

            Continue →

        </button>

    </div>

</div>

<div id="loadingScreen"
class="loading-screen">

    <div class="loader"></div>

    <p>
        Saving Contact Details...
    </p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCajHdn60cCNoivFXrpPOh0xRNRY_rinMQ",

authDomain: "loan-19007.firebaseapp.com",

projectId: "loan-19007",

storageBucket: "loan-19007.firebasestorage.app",

messagingSenderId: "175686513150",

appId: "1:175686513150:web:f25e43507db445998d10af"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.nextPage =
async function(){

let alternate =
document.getElementById("alternate").value;

let emergency =
document.getElementById("emergency").value;

let phone =
localStorage.getItem(
"customerPhone"
);

await setDoc(
doc(db,"loanApplications",phone),
{

alternateNumber:alternate,
emergencyContact:emergency

},
{merge:true}
);

document
.getElementById("loadingScreen")
.style.display = "flex";

setTimeout(function(){

window.location.href =
"bank-details.html";

},3000);

}

</script>

</body>
</html>
