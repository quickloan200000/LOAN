<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alternate Numbers</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="loan-page">

    <div class="top-box">
        <h1>Contact Details</h1>
        <p>Add alternate & emergency contact numbers</p>
    </div>

    <div class="card">

        <div class="approve-box">

            <h2>📞 Alternate Contact</h2>

            <p>
                Please provide alternate mobile numbers
                for verification purposes.
            </p>

        </div>

        <div class="details-box">

            <div class="detail-row" style="border:none;display:block;">

                <label style="font-size:18px;font-weight:bold;">
                    Alternate Mobile Number
                </label>

                <input
                type="number"
                id="altNumber"
                placeholder="Enter Alternate Number"
                style="margin-top:10px;">

            </div>

            <div class="detail-row" style="border:none;display:block;">

                <label style="font-size:18px;font-weight:bold;">
                    Emergency Contact Number
                </label>

                <input
                type="number"
                id="emergencyNumber"
                placeholder="Enter Emergency Contact"
                style="margin-top:10px;">

            </div>

            <div class="detail-row" style="border:none;display:block;">

                <label style="font-size:18px;font-weight:bold;">
                    Landline Number (Optional)
                </label>

                <input
                type="number"
                id="landline"
                placeholder="Enter Landline Number"
                style="margin-top:10px;">

            </div>

        </div>

        <button
        class="apply-btn"
        onclick="nextPage()">

            Continue →

        </button>

    </div>

</div>

<div id="loadingScreen" class="loading-screen">

    <div class="loader"></div>

    <p>
        Verifying Contact Details...
    </p>

</div>

<script>

function nextPage(){

    let alt =
    document.getElementById("altNumber").value;

    let emergency =
    document.getElementById("emergencyNumber").value;

    if(alt==="" || emergency===""){

        alert("Please fill all required fields");

        return;
    }

    localStorage.setItem(
    "alternateNumber",
    alt
    );

    localStorage.setItem(
    "emergencyNumber",
    emergency
    );

    document
    .getElementById("loadingScreen")
    .style.display = "flex";

    setTimeout(function(){

        window.location.href =
        "photo-upload.html";

    },2500);

}

</script>

</body>
</html>
