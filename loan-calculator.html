<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan Calculator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

<h2>₹2,50,000 Eligible</h2>

<input
type="number"
id="amount"
value="50000"
oninput="calculate()"
>

<div class="row">
Interest : 2.5%
</div>

<div class="row">
Tenure : 36 Months
</div>

<div class="row">
Processing Fee : ₹2500
</div>

<div class="row">
GST : ₹450
</div>

<div class="row">
Monthly EMI : ₹<span id="emi"></span>
</div>

<div class="row">
Total Repayment : ₹<span id="total"></span>
</div>

<button onclick="submitApplication()">
Submit Application
</button>

</div>

<script>

function calculate(){

let amount=
parseInt(document.getElementById("amount").value)||0;

let interest=2.5;

let months=36;

let processingFee=2500;

let gst=450;

let emi=Math.round(
(amount/months)
+
(amount*interest/100)
);

let total=
(emi*months)
+
processingFee
+
gst;

document.getElementById("emi").innerHTML=
emi.toLocaleString();

document.getElementById("total").innerHTML=
total.toLocaleString();

localStorage.setItem(
"loanAmount",
amount.toLocaleString()
);

}

calculate();

function submitApplication(){

document.body.innerHTML=`

<div class="card">

<div class="loader"></div>

<h2>Submitting Application...</h2>

</div>

`;

setTimeout(function(){

window.location.href="pending-status.html";

},3000);

}

</script>

</body>
</html>
