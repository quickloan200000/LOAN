<!DOCTYPE html>
<html>
<head>
<title>Loan Calculator</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
padding:20px;
background:#f3f3f3;
font-family:sans-serif;
}

.card{
max-width:350px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
font-size:20px;
border-radius:10px;
border:1px solid #ccc;
margin-top:10px;
box-sizing:border-box;
}

.row{
margin-top:15px;
font-size:18px;
}

button{
width:100%;
padding:15px;
background:#ffd500;
border:none;
border-radius:12px;
font-size:18px;
margin-top:25px;
}

</style>
</head>

<body>

<div class="card">

<h2>₹2,50,000 Eligible</h2>

<label>Enter Loan Amount</label>

<input
type="number"
id="amount"
value="250000"
oninput="calculate()"
>

<div class="row">
Interest : 2.5%
</div>

<div class="row">
Tenure : 36 Months
</div>

<div class="row">
Processing Fee : ₹2500
</div>

<div class="row">
GST : ₹450
</div>

<div class="row">
Monthly EMI : ₹<span id="emi"></span>
</div>

<div class="row">
Total Repayment : ₹<span id="total"></span>
</div>

<button onclick="submitApplication()">
Submit Application
</button>

</div>

<script>

function calculate(){

let amount =
parseInt(document.getElementById("amount").value);

let interest = 2.5;

let months = 36;

let processingFee = 2500;

let gst = 450;

let emi =
Math.round(
(amount/months)
+
(amount*interest/100)
);

let total =
(emi * months)
+
processingFee
+
gst;

document.getElementById("emi").innerHTML =
emi.toLocaleString();

document.getElementById("total").innerHTML =
total.toLocaleString();

}

calculate();

function submitApplication(){

window.location.href =
"pending-status.html";

}

</script>

</body>
</html>
