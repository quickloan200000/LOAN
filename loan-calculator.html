<!DOCTYPE html>
<html>
<head>
<title>Loan Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card">

<h2>₹2,50,000 Eligible</h2>

<label>Enter Loan Amount</label>

<input
type="number"
id="amount"
value="50000"
oninput="calculate()"
>

<div class="row">
Interest : 2.5%
</div>

<div class="row">
Tenure : 36 Months
</div>

<div class="row">
Processing Fee : ₹2500
</div>

<div class="row">
GST : ₹450
</div>

<div class="row">
Monthly EMI : ₹<span id="emi"></span>
</div>

<div class="row">
Total Repayment : ₹<span id="total"></span>
</div>

<button onclick="submitApplication()">
Submit Application
</button>

</div>

<script>

function calculate(){

let amount = parseInt(document.getElementById("amount").value) || 0;

let interest = 2.5;
let months = 36;
let processingFee = 2500;
let gst = 450;

let totalInterest = (amount * interest / 100) * 3;

let totalAmount = amount + totalInterest;

let emi = Math.round(totalAmount / months);

let total = totalAmount + processingFee + gst;

localStorage.setItem("loanAmount", amount.toLocaleString());


document.getElementById("emi").innerHTML =
emi.toLocaleString();


document.getElementById("total").innerHTML =
total.toLocaleString();

}

calculate();

function submitApplication(){
window.location.href = "pending-status.html";
}

</script>

</body>
</html>
