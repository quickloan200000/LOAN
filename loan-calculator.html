<!DOCTYPE html>
<html>
<head>
<title>Loan Calculator</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
padding:20px;
background:#f3f3f3;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:100%;
max-width:350px;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
font-size:34px;
margin-bottom:30px;
}

label{
font-size:22px;
}

input{
width:100%;
padding:18px;
font-size:28px;
border-radius:15px;
border:3px solid black;
margin-top:15px;
box-sizing:border-box;
}

.row{
margin-top:22px;
font-size:24px;
}

button{
width:100%;
padding:18px;
background:#ffd500;
border:none;
border-radius:15px;
font-size:24px;
margin-top:35px;
cursor:pointer;
}

.loader-page{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:white;
}

.spinner{
width:70px;
height:70px;
border:8px solid #ddd;
border-top:8px solid #ffd500;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:20px;
}

@keyframes spin{
0%{
transform:rotate(0deg);
}
100%{
transform:rotate(360deg);
}
}

</style>
</head>

<body>

<div class="card">

<h2>₹2,50,000 Eligible</h2>

<label>Enter Loan Amount</label>

<input
type="number"
id="amount"
value="50000"
oninput="calculate()"
max="250000"
min="10000"
>

<div class="row">
Interest : 2.5%
</div>

<div class="row">
Tenure : 36 Months
</div>

<div class="row">
Processing Fee : ₹2500
</div>

<div class="row">
GST : ₹450
</div>

<div class="row">
Monthly EMI : ₹<span id="emi"></span>
</div>

<div class="row">
Total Repayment : ₹<span id="total"></span>
</div>

<button onclick="submitApplication()">
Submit Application
</button>

</div>

<script>

function calculate(){

let amount =
parseInt(document.getElementById("amount").value);

if(amount > 250000){
amount = 250000;
document.getElementById("amount").value = 250000;
}

let interest = 2.5;

let months = 36;

let processingFee = 2500;

let gst = 450;

let totalInterest =
(amount * interest / 100) * 3;

let totalLoan =
amount + totalInterest;

let emi =
Math.round(totalLoan / months);

let total =
totalLoan +
processingFee +
gst;

document.getElementById("emi").innerHTML =
emi.toLocaleString('en-IN');

document.getElementById("total").innerHTML =
Math.round(total).toLocaleString('en-IN');

}

calculate();

function submitApplication(){

let amount =
document.getElementById("amount").value;

// SAVE AMOUNT
localStorage.setItem("loanAmount", amount);

// LOADING PAGE
document.body.innerHTML = `

<div class="loader-page">

<div class="spinner"></div>

<h2>Submitting Application...</h2>

</div>

`;

setTimeout(function(){

window.location.href =
"pending-status.html";

},3000);

}

</script>

</body>
</html>
