<!DOCTYPE html>
<html>
<head>
<title>Upload Documents</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
padding:0;
background:#f3f3f3;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.card{
width:320px;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h2{
text-align:center;
margin-bottom:20px;
}

.box{
border:2px dashed #ccc;
padding:20px;
margin-bottom:20px;
border-radius:15px;
text-align:center;
}

input{
margin-top:15px;
width:100%;
}

button{
width:100%;
padding:15px;
border:none;
background:#ffd500;
font-size:18px;
border-radius:12px;
}

p{
text-align:center;
margin-top:15px;
font-size:14px;
}

</style>

</head>

<body>

<div class="card">

<h2>Upload Documents</h2>

<div class="box">
<h3>Upload Aadhaar Card</h3>
<input type="file">
</div>

<div class="box">
<h3>Upload PAN Card</h3>
<input type="file">
</div>

<div class="box">
<h3>Upload Passbook</h3>
<input type="file">
</div>

<button onclick="submitDocs()">
Submit Documents
</button>

<p>Verifying Documents...</p>

</div>

<script>

function submitDocs(){

window.location.href="loan-amount.html";

}

</script>

</body>
</html>
