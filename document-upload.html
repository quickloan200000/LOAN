<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Document Upload</title>

<link rel="stylesheet"
href="style.css">

<style>

body{
margin:0;
padding:0;
background:#eef2f7;
font-family:sans-serif;
}

.loan-page{
padding:25px 20px;
}

.top-box{
margin-top:60px;
margin-bottom:30px;
}

.top-box h1{
font-size:42px;
margin-bottom:15px;
color:#111;
}

.top-box p{
font-size:20px;
color:#333;
}

.card{
background:white;
border-radius:35px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.approve-box{
text-align:center;
margin-bottom:30px;
}

.approve-box h2{
font-size:34px;
margin-bottom:15px;
}

.approve-box p{
font-size:20px;
line-height:32px;
color:#444;
}

.detail-row{
margin-bottom:30px;
}

.detail-row label{
display:block;
font-size:22px;
font-weight:bold;
margin-bottom:15px;
color:#111;
}

.detail-row input{
width:100%;
padding:20px;
border-radius:20px;
border:2px dashed #ccc;
background:#f7f9fc;
font-size:20px;
box-sizing:border-box;
}

.file-name{
margin-top:10px;
font-size:18px;
color:green;
font-weight:bold;
}

.apply-btn{
width:100%;
height:75px;
border:none;
border-radius:25px;
background:#ffc400;
font-size:30px;
font-weight:bold;
margin-top:20px;
cursor:pointer;
color:#111;
}

.loading-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,0.96);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.loader{
width:95px;
height:95px;
border:10px solid #e5e5e5;
border-top:10px solid #ffd500;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:25px;
}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

.loading-screen p{
font-size:34px;
font-weight:bold;
color:#111;
}

</style>

</head>

<body>

<div class="loan-page">

<div class="top-box">

<h1>
Document Upload
</h1>

<p>
Upload your required KYC documents
</p>

</div>

<div class="card">

<div class="approve-box">

<h2>
📄 Verify Your Documents
</h2>

<p>
Upload clear images or PDF files
for faster verification.
</p>

</div>

<div class="details-box">

<div class="detail-row">

<label>
Aadhaar Card
</label>

<input
type="file"
id="aadhaar"
accept="image/*,.pdf"
onchange="showFileName('aadhaar','aadhaarName')">

<div class="file-name"
id="aadhaarName"></div>

</div>

<div class="detail-row">

<label>
PAN Card
</label>

<input
type="file"
id="pan"
accept="image/*,.pdf"
onchange="showFileName('pan','panName')">

<div class="file-name"
id="panName"></div>

</div>

<div class="detail-row">

<label>
Bank Passbook
</label>

<input
type="file"
id="passbook"
accept="image/*,.pdf"
onchange="showFileName('passbook','passbookName')">

<div class="file-name"
id="passbookName"></div>

</div>

</div>

<button
class="apply-btn"
onclick="nextPage()">

Submit Documents →

</button>

</div>

</div>

<div id="loadingScreen"
class="loading-screen">

<div class="loader"></div>

<p>
Verifying Documents...
</p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCajHdn60cCNoivFXrpPOh0xRNRY_rinMQ",

authDomain: "loan-19007.firebaseapp.com",

projectId: "loan-19007",

storageBucket: "loan-19007.appspot.com",

messagingSenderId: "175686513150",

appId: "1:175686513150:web:f25e43507db445998d10af"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.showFileName =
function(inputId, textId){

let file =
document.getElementById(inputId)
.files[0];

if(file){

document
.getElementById(textId)
.innerText =
"✓ " + file.name;

}

}

window.nextPage =
async function(){

let aadhaar =
document.getElementById("aadhaar");

let pan =
document.getElementById("pan");

let passbook =
document.getElementById("passbook");

if(
aadhaar.files.length === 0 ||
pan.files.length === 0 ||
passbook.files.length === 0
){

alert(
"Please upload all documents"
);

return;

}

let phone =
localStorage.getItem(
"customerPhone"
);

await setDoc(
doc(db,"loanApplications",phone),
{

aadhaarUploaded:"Yes",
panUploaded:"Yes",
passbookUploaded:"Yes",
status:"Documents Uploaded"

},
{merge:true}
);

localStorage.setItem(
"documentsUploaded",
"yes"
);

document
.getElementById("loadingScreen")
.style.display = "flex";

setTimeout(function(){

window.location.href =
"eligibility.html";

},3000);

}

</script>

</body>
</html>
