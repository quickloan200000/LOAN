<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Upload</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="loan-page">

    <div class="top-box">
        <h1>Document Upload</h1>
        <p>Upload your required KYC documents</p>
    </div>

    <div class="card">

        <div class="approve-box">

            <h2>📄 Verify Your Documents</h2>

            <p>
                Upload clear images or PDF files
                for faster verification.
            </p>

        </div>

        <div class="details-box">

            <div class="detail-row" style="border:none;display:block;">

                <label style="font-size:18px;font-weight:bold;">
                    Aadhaar Card
                </label>

                <input
                type="file"
                id="aadhaar"
                accept="image/*,.pdf"
                style="margin-top:10px;">

            </div>

            <div class="detail-row" style="border:none;display:block;">

                <label style="font-size:18px;font-weight:bold;">
                    PAN Card
                </label>

                <input
                type="file"
                id="pan"
                accept="image/*,.pdf"
                style="margin-top:10px;">

            </div>

            <div class="detail-row" style="border:none;display:block;">

                <label style="font-size:18px;font-weight:bold;">
                    Bank Passbook
                </label>

                <input
                type="file"
                id="passbook"
                accept="image/*,.pdf"
                style="margin-top:10px;">

            </div>

        </div>

        <button
        class="apply-btn"
        onclick="nextPage()">

            Submit Documents →

        </button>

    </div>

</div>

<div id="loadingScreen" class="loading-screen">

    <div class="loader"></div>

    <p>
        Verifying Documents...
    </p>

</div>

<script>

function nextPage(){

    let aadhaar =
    document.getElementById("aadhaar").files.length;

    let pan =
    document.getElementById("pan").files.length;

    let passbook =
    document.getElementById("passbook").files.length;

    if(
    aadhaar===0 ||
    pan===0 ||
    passbook===0){

        alert("Please upload all required documents");

        return;
    }

    document
    .getElementById("loadingScreen")
    .style.display = "flex";

    setTimeout(function(){

        window.location.href =
        "eligibility.html";

    },3000);

}

</script>

</body>
</html>
