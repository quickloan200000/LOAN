<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document Upload</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Upload Documents</h1>

    <!-- Aadhaar -->
    <div class="upload-box">
        <h2>Upload Aadhaar Card</h2>
        <input type="file" accept="image/*,.pdf">
    </div>

    <!-- PAN -->
    <div class="upload-box">
        <h2>Upload PAN Card</h2>
        <input type="file" accept="image/*,.pdf">
    </div>

    <!-- Passbook -->
    <div class="upload-box">
        <h2>Upload Passbook</h2>
        <input type="file" accept="image/*,.pdf">
    </div>

    <!-- Button -->
    <button class="btn" onclick="nextPage()">
        Submit Documents
    </button>

</div>

<script>
function nextPage() {
    window.location.href = "loan-amount.html";
}
</script>

</body>
</html>
