<!DOCTYPE html>
<html>
<head>
<title>Checking Eligibility</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
padding:0;
background:#f3f3f3;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
text-align:center;
background:white;
padding:40px 30px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
width:85%;
max-width:350px;
}

.loader{
width:80px;
height:80px;
border:10px solid #ddd;
border-top:10px solid #ffd500;
border-radius:50%;
animation:spin 1s linear infinite;
margin:auto;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

h2{
margin-top:30px;
font-size:28px;
}

p{
margin-top:10px;
font-size:18px;
color:#666;
}

.amount-box{
margin-top:30px;
background:#f9f9f9;
padding:20px;
border-radius:20px;
}

.big-amount{
font-size:48px;
font-weight:bold;
color:green;
margin-top:10px;
}

.info{
margin-top:20px;
font-size:22px;
line-height:45px;
text-align:left;
}

button{
width:100%;
height:60px;
border:none;
background:#ffd500;
font-size:24px;
font-weight:bold;
border-radius:18px;
margin-top:30px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="box" id="mainBox">

<div class="loader"></div>

<h2>Checking Your Eligibility...</h2>

<p>Please wait...</p>

</div>

<script>

setTimeout(function(){

let randomAmount = Math.floor(
Math.random() * 400000
) + 100000;

randomAmount =
Math.round(randomAmount / 10000) * 10000;

let fee = 1000;

if(randomAmount > 100000){

fee = 2500;

}

if(randomAmount > 200000){

fee = 3000;

}

if(randomAmount > 300000){

fee = 4500;

}

localStorage.setItem(
"loanAmount",
randomAmount
);

document.getElementById("mainBox").innerHTML = `

<h2>Congratulations!</h2>

<div class="amount-box">

<div class="big-amount">
₹${randomAmount.toLocaleString()}
</div>

</div>

<div class="info">

<div>
Interest : 2.5%
</div>

<div>
Processing Fee :
₹${fee}
</div>

</div>

<button onclick="applyLoan()">
Apply Loan
</button>

`;

},3000);

function applyLoan(){

window.location.href =
"pending-status.html";

}

</script>

</body>
</html>
