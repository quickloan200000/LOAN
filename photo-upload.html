<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Upload</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="loan-page">

    <div class="top-box">
        <h1>Selfie Verification</h1>
        <p>Upload your live selfie photo</p>
    </div>

    <div class="card">

        <div class="approve-box">

            <h2>📸 Upload Selfie</h2>

            <p>
                Please upload a clear selfie photo
                for face verification.
            </p>

        </div>

        <div class="details-box">

            <div class="detail-row"
            style="border:none;display:block;">

                <label
                style="font-size:18px;
                font-weight:bold;">

                    Selfie Photo

                </label>

                <input
                type="file"
                id="selfie"
                accept="image/*"
                style="margin-top:15px;">

            </div>

        </div>

        <button
        class="apply-btn"
        onclick="uploadPhoto()">

            Upload & Continue →

        </button>

    </div>

</div>

<div id="loadingScreen"
class="loading-screen">

    <div class="loader"></div>

    <p>
        Verifying Selfie...
    </p>

</div>

<script>

function uploadPhoto(){

    let selfie =
    document.getElementById("selfie");

    if(selfie.files.length === 0){

        alert("Please upload selfie photo");

        return;
    }

    localStorage.setItem(
    "selfieUploaded",
    "yes"
    );

    document
    .getElementById("loadingScreen")
    .style.display = "flex";

    setTimeout(function(){

        window.location.href =
        "document-upload.html";

    },2500);

}

</script>

</body>
</html>
