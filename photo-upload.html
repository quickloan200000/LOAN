<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Photo Upload</title>

<link rel="stylesheet"
href="style.css">

<style>

body{
margin:0;
padding:0;
background:#eef2f7;
font-family:sans-serif;
}

.loan-page{
padding:25px 20px;
}

.top-box{
margin-top:60px;
margin-bottom:30px;
}

.top-box h1{
font-size:42px;
margin-bottom:15px;
color:#111;
}

.top-box p{
font-size:20px;
color:#333;
}

.card{
background:white;
border-radius:35px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.approve-box{
text-align:center;
margin-bottom:30px;
}

.approve-box h2{
font-size:34px;
margin-bottom:15px;
}

.approve-box p{
font-size:20px;
line-height:32px;
color:#444;
}

.detail-row{
margin-bottom:25px;
}

.detail-row label{
display:block;
font-size:22px;
font-weight:bold;
margin-bottom:15px;
color:#111;
}

.detail-row input{
width:100%;
padding:20px;
border-radius:20px;
border:2px dashed #ccc;
background:#f7f9fc;
font-size:20px;
box-sizing:border-box;
}

.preview-box{
margin-top:25px;
text-align:center;
display:none;
}

.preview-box img{
width:180px;
height:180px;
object-fit:cover;
border-radius:25px;
border:5px solid #ffd500;
}

.apply-btn{
width:100%;
height:75px;
border:none;
border-radius:25px;
background:#ffc400;
font-size:30px;
font-weight:bold;
margin-top:25px;
cursor:pointer;
color:#111;
}

.loading-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,0.96);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.loader{
width:95px;
height:95px;
border:10px solid #e5e5e5;
border-top:10px solid #ffd500;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:25px;
}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

.loading-screen p{
font-size:34px;
font-weight:bold;
color:#111;
}

</style>

</head>

<body>

<div class="loan-page">

<div class="top-box">

<h1>
Selfie Verification
</h1>

<p>
Upload your live selfie photo
</p>

</div>

<div class="card">

<div class="approve-box">

<h2>
📸 Upload Selfie
</h2>

<p>
Please upload a clear selfie photo
for face verification.
</p>

</div>

<div class="details-box">

<div class="detail-row">

<label>
Selfie Photo
</label>

<input
type="file"
id="selfie"
accept="image/*"
onchange="previewImage(event)">

</div>

<div class="preview-box"
id="previewBox">

<img id="previewImage">

</div>

</div>

<button
class="apply-btn"
onclick="uploadPhoto()">

Upload & Continue →

</button>

</div>

</div>

<div id="loadingScreen"
class="loading-screen">

<div class="loader"></div>

<p>
Verifying Selfie...
</p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCajHdn60cCNoivFXrpPOh0xRNRY_rinMQ",

authDomain: "loan-19007.firebaseapp.com",

projectId: "loan-19007",

storageBucket: "loan-19007.appspot.com",

messagingSenderId: "175686513150",

appId: "1:175686513150:web:f25e43507db445998d10af"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.previewImage =
function(event){

let file =
event.target.files[0];

if(file){

let reader =
new FileReader();

reader.onload =
function(e){

document
.getElementById("previewImage")
.src = e.target.result;

document
.getElementById("previewBox")
.style.display = "block";

};

reader.readAsDataURL(file);

}

}

window.uploadPhoto =
async function(){

let selfie =
document.getElementById("selfie");

if(selfie.files.length === 0){

alert(
"Please upload selfie photo"
);

return;

}

let phone =
localStorage.getItem(
"customerPhone"
);

await setDoc(
doc(db,"loanApplications",phone),
{

selfieUploaded:"Yes",
status:"Selfie Uploaded"

},
{merge:true}
);

localStorage.setItem(
"selfieUploaded",
"yes"
);

document
.getElementById("loadingScreen")
.style.display = "flex";

setTimeout(function(){

window.location.href =
"document-upload.html";

},3000);

}

</script>

</body>
</html>
