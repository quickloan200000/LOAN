
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register Mobile Number</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
padding:0;
background:#eef2f7;
font-family:sans-serif;
}

.loan-page{
padding:30px 20px;
}

.top-box{
margin-top:80px;
margin-bottom:30px;
}

.top-box h1{
font-size:42px;
color:#111;
margin-bottom:15px;
line-height:55px;
}

.top-box p{
font-size:20px;
color:#333;
}

.card{
background:white;
border-radius:35px;
padding:30px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
position:relative;
overflow:hidden;
}

.approve-box{
text-align:center;
margin-bottom:30px;
}

.approve-box h2{
font-size:32px;
margin-bottom:15px;
color:#111;
}

.approve-box p{
font-size:20px;
line-height:35px;
color:#444;
}

.detail-row{
margin-top:20px;
}

.detail-row label{
display:block;
font-size:22px;
font-weight:bold;
margin-bottom:15px;
text-align:center;
}

.detail-row input{
width:100%;
height:70px;
border-radius:20px;
border:2px solid #ddd;
padding:0 20px;
font-size:24px;
box-sizing:border-box;
outline:none;
background:#f5f7fb;
}

.apply-btn{
width:100%;
height:75px;
border:none;
border-radius:25px;
background:#ffc400;
font-size:32px;
font-weight:bold;
margin-top:35px;
cursor:pointer;
color:#111;
}

.loading-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(255,255,255,0.92);
display:none;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

.loader{
width:90px;
height:90px;
border:10px solid #e5e5e5;
border-top:10px solid #ffd500;
border-radius:50%;
animation:spin 1s linear infinite;
margin-bottom:25px;
}

@keyframes spin{

100%{
transform:rotate(360deg);
}

}

.loading-screen p{
font-size:34px;
font-weight:bold;
color:#111;
}

</style>

</head>

<body>

<div class="loan-page">

<div class="top-box">

<h1>
Register Mobile Number
</h1>

<p>
Enter customer mobile number
</p>

</div>

<div class="card">

<div class="approve-box">

<h2>
📱 Mobile Verification
</h2>

<p>
Mobile number is required for
loan application process
</p>

</div>

<div class="details-box">

<div class="detail-row">

<label>
Mobile Number
</label>

<input
type="tel"
id="phone"
maxlength="10"
placeholder="Enter Mobile Number">

</div>

</div>

<button
class="apply-btn"
onclick="nextPage()">

Continue →

</button>

</div>

</div>

<div id="loadingScreen"
class="loading-screen">

<div class="loader"></div>

<p>
Checking Number...
</p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCajHdn60cCNoivFXrpPOh0xRNRY_rinMQ",

authDomain: "loan-19007.firebaseapp.com",

projectId: "loan-19007",

storageBucket: "loan-19007.appspot.com",

messagingSenderId: "175686513150",

appId: "1:175686513150:web:f25e43507db445998d10af"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.nextPage =
async function(){

let phone =
document.getElementById("phone")
.value.trim();

if(phone.length != 10){

alert(
"Please enter valid 10 digit mobile number"
);

return;

}

localStorage.setItem(
"customerPhone",
phone
);

await setDoc(
doc(db,"loanApplications",phone),
{

phone:phone,
status:"Mobile Verified",
createdAt:new Date().toISOString()

},
{merge:true}
);

document
.getElementById("loadingScreen")
.style.display = "flex";

setTimeout(function(){

window.location.href =
"personal-details.html";

},3000);

}

</script>

</body>
</html>
