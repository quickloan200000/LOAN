<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Phone Register</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="loan-page">

    <div class="top-box">

        <h1>
            Register Mobile Number
        </h1>

        <p>
            Enter customer mobile number
        </p>

    </div>

    <div class="card">

        <div class="approve-box">

            <h2>
                📱 Mobile Verification
            </h2>

            <p>
                Mobile number is required
                for loan application process
            </p>

        </div>

        <div class="details-box">

            <div class="detail-row"
            style="border:none;display:block;">

                <label
                style="font-size:18px;
                font-weight:bold;">

                    Mobile Number

                </label>

                <input
                type="number"
                id="phone"
                placeholder="Enter Mobile Number"
                style="margin-top:10px;">

            </div>

        </div>

        <button
        class="apply-btn"
        onclick="nextPage()">

            Continue →

        </button>

    </div>

</div>

<div id="loadingScreen"
class="loading-screen">

    <div class="loader"></div>

    <p>
        Checking Number...
    </p>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
doc,
setDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyCajHdn60cCNoivFXrpPOh0xRNRY_rinMQ",

authDomain: "loan-19007.firebaseapp.com",

projectId: "loan-19007",

storageBucket: "loan-19007.firebasestorage.app",

messagingSenderId: "175686513150",

appId: "1:175686513150:web:f25e43507db445998d10af"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

window.nextPage =
async function(){

let phone =
document.getElementById("phone").value;

if(phone.length != 10){

alert(
"Enter valid mobile number"
);

return;

}

localStorage.setItem(
"customerPhone",
phone
);

await setDoc(
doc(db,"loanApplications",phone),
{

phone:phone,
status:"Started"

},
{merge:true}
);

document
.getElementById("loadingScreen")
.style.display = "flex";

setTimeout(function(){

window.location.href =
"personal-details.html";

},3000);

}

</script>

</body>
</html>
