<!DOCTYPE html>
<html>
<head>
<title>Pending Status</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
margin:0;
padding:20px;
background:#f3f3f3;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.card{
width:100%;
max-width:350px;
background:white;
padding:25px;
border-radius:25px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
text-align:center;
}

h2{
font-size:26px;
margin-bottom:25px;
}

.amount{
font-size:48px;
font-weight:bold;
margin-bottom:35px;
}

.status{
font-size:22px;
margin:20px 0;
text-align:left;
padding-left:20px;
}

button{
width:100%;
padding:18px;
background:#ffd500;
border:none;
border-radius:15px;
font-size:24px;
margin-top:35px;
}

</style>
</head>

<body>

<div class="card">

<h2>
Application Submitted Successfully
</h2>

<div class="amount" id="loanAmount">
₹0
</div>

<div class="status">
✔ Documents Verified
</div>

<div class="status">
✔ KYC Verified
</div>

<div class="status">
⏳ RBI Review Pending
</div>

<div class="status">
⏳ Approval Pending
</div>

<div class="status">
⏳ Disbursement Pending
</div>

<button onclick="trackApplication()">
Track Application
</button>

</div>

<script>

// localStorage ல இருந்து amount எடுக்குது
let amount =
localStorage.getItem("loanAmount");

// amount இல்லனா default
if(!amount){
amount = 50000;
}

// display amount
document.getElementById("loanAmount").innerHTML =
"₹" + Number(amount).toLocaleString('en-IN');

function trackApplication(){

alert("Application Under Review");

}

</script>

</body>
</html>
