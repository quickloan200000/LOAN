<!DOCTYPE html>
<html>
<head>
    <title>Application Status</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h2>Application Submitted Successfully</h2>

        <h1 id="loanAmount">₹0</h1>

        <div class="status-list">

            <p>✔ Documents Verified</p>

            <p>✔ KYC Verified</p>

            <p>⏳ RBI Review Pending</p>

            <p>⏳ Approval Pending</p>

            <p>⏳ Disbursement Pending</p>

        </div>

        <button onclick="trackApplication()">
            Track Application
        </button>

    </div>

</div>

<script>

    // loan-calculator page ல இருந்து amount எடுக்குது
    let amount = localStorage.getItem("loanAmount");

    // amount இல்லனா default
    if(!amount){
        amount = 250000;
    }

    // ரூபாய் format
    document.getElementById("loanAmount").innerHTML =
        "₹" + Number(amount).toLocaleString('en-IN');

    function trackApplication(){
        alert("Application Under Review");
    }

</script>

</body>
</html>
